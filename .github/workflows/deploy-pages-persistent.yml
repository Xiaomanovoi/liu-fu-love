name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site artifact
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Checkout official Pages deploy action
        uses: actions/checkout@v4
        with:
          repository: actions/deploy-pages
          path: .deploy-pages-action

      - name: Extend the official queue timeout
        shell: bash
        run: |
          sed -i 's/const MAX_TIMEOUT = 600000/const MAX_TIMEOUT = 3600000/' \
            .deploy-pages-action/dist/index.js
          grep -q 'const MAX_TIMEOUT = 3600000' .deploy-pages-action/dist/index.js

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.deploy-pages-action
        with:
          timeout: 3600000
